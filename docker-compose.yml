services:
  # ---- Postgres：账号与租户数据（Prisma）----
  postgres:
    image: postgres:17-alpine
    container_name: smart_campus_postgres
    environment:
      # 与本地开发时 frontend/.env.local 的连接串保持一致，便于复用同一个数据卷
      POSTGRES_USER: campus
      POSTGRES_DB: smart_campus
      # 未设置时 compose 直接报错退出，不允许空密码起库
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}
    ports:
      # 5433：避免与本机已装的 Postgres 冲突；容器内仍是 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d smart_campus"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ---- Redis Stack（含 RediSearch 模块）----
  redis:
    image: redis/redis-stack:latest
    container_name: smart_campus_redis
    ports:
      # 6380：避免与本机已占用的 6379 冲突；容器内仍是 6379
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ---- FastAPI 接口服务 ----
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_campus_api
    command:
      ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # 8001：避开本机已被占用的 8000
      - "8001:8000"
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      # 规章维基只读挂载，改 markdown 后重启容器即可重新索引
      - ./wiki:/app/wiki:ro
      - chroma-data:/app/backend/chroma_db_data
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - REDIS_URL=redis://redis:6379
      - HF_HOME=/root/.cache/huggingface
      - HF_ENDPOINT=https://huggingface.co
      - FRONTEND_ORIGINS=http://localhost:3000
      # 与 web 同源，两端验签密钥不可能对不上。大模型 API Key 仍读 backend/.env
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?请在根目录 .env 中设置 AUTH_JWT_SECRET}
      # 只读工作区设置与嵌入挂件配置（backend/workspace.py）
      - DATABASE_URL=postgresql://campus:${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/smart_campus
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- 建表：一次性任务，跑完退出，web 等它成功后再起 ----
  migrate:
    build:
      context: ./frontend
      target: migrator
    container_name: smart_campus_migrate
    environment:
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/smart_campus
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---- Next.js 前端 ----
  web:
    build:
      context: ./frontend
      args:
        # 浏览器直连 API，这里填用户可访问的地址（部署到服务器时换成公网域名）
        NEXT_PUBLIC_API_BASE: http://localhost:8001
    container_name: smart_campus_web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/smart_campus
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?请在根目录 .env 中设置 AUTH_JWT_SECRET}
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- 旧版 Streamlit 一体化界面（docker compose --profile legacy up）----
  app:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_campus_app
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "app.py",
        "--server.headless=true",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    ports:
      - "8502:8501"
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./wiki:/app/wiki:ro
      - chroma-data:/app/backend/chroma_db_data
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - REDIS_URL=redis://redis:6379
      - HF_HOME=/root/.cache/huggingface
      - HF_ENDPOINT=https://huggingface.co
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_CLIENT_TOOLBAR_MODE=viewer
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  huggingface-cache:
