<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>平台小本子</title>
  <link rel="stylesheet" href="__ROOT__/assets/desk.css" />
</head>
<body>
  <svg width="0" height="0" aria-hidden="true">
    <filter id="ink-wobble" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" />
    </filter>
  </svg>
  <main class="wrap">
    <section class="paper">
      <h1>平台小本子</h1>
      <p class="lede">学校管理员才能翻开这一本。用校园里的<span class="mark">学号和密码</span>，不是另一套账号。</p>
      <form method="post" action="__ROOT__/login">
        <label>学校标识
          <input class="field" name="tenant" value="wtli" autocomplete="organization" required />
        </label>
        <label>学号 / 工号
          <input class="field" name="studentNo" autocomplete="username" required />
        </label>
        <label>密码
          <input class="field" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn" type="submit">翻开</button>
      </form>
      <p class="alert" role="alert">__ERROR__</p>
    </section>
  </main>
</body>
</html>
