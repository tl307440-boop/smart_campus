<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园桌宠</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 320px;
      height: 270px;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    /* 容器 */
    #pet-container {
      position: relative;
      width: 320px;
      height: 270px;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto !important;
    }

    /* ===== 桌宠主体 ===== */
    #pet {
      --fx: 0px;
      --fy: 0px;
      --tilt: 0deg;
      position: absolute;
      bottom: 10px;
      left: 95px;
      width: 130px;
      height: 130px;
      cursor: grab;
      touch-action: none;
      outline: none;
    }
    #pet.dragging { cursor: grabbing; }

    #pet-body {
      width: 100%;
      height: 100%;
      transform: translate3d(var(--fx), var(--fy), 0) rotate(var(--tilt));
      transform-origin: 50% 30%;
    }

    #pet-motion {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
      animation: float 4.8s ease-in-out infinite;
    }
    #pet.mood-sleepy #pet-motion   { animation: breathe 3.4s ease-in-out infinite; }
    #pet.mood-dragging #pet-motion { animation: none; transform: scale(1.06); }
    #pet:hover #pet-motion         { transform: scale(1.05); }
    #pet.pressed #pet-motion       { transform: scale(0.94); }

    #pet-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 6px rgba(27,18,20,.16));
    }
    #pet:focus-visible #pet-svg {
      filter: drop-shadow(0 0 6px rgba(255,140,170,.9));
    }

    /* 眼睛 */
    .pupil {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.15s ease;
    }
    #pet.mood-surprised .pupil { transform: scale(0.65); }

    .lid {
      transform-box: fill-box;
      transform-origin: top;
      transform: scaleY(0);
      transition: transform 0.09s ease-in;
    }
    .lid.closed { transform: scaleY(1); }
    #pet.mood-sleepy .lid { transition-duration: 0.6s; }

    .spiral-path {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.9s linear infinite;
    }
    .blush { animation: blushAnim 0.9s ease-in-out infinite alternate; }
    .nose-bubble {
      transform-box: fill-box;
      transform-origin: 30% 30%;
      animation: noseBubble 3.4s ease-in-out infinite;
    }

    /* 跳跃动效 */
    .hopA  { animation: hopA  0.42s cubic-bezier(0.3,1.6,0.5,1); }
    .hopB  { animation: hopB  0.42s cubic-bezier(0.3,1.6,0.5,1); }
    .landA { animation: landA 0.38s ease-out; }
    .landB { animation: landB 0.38s ease-out; }

    /* ===== 原版气泡 ===== */
    #bubble {
      display: none;
      position: absolute;
      bottom: 144px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 275px;
      min-width: 120px;
      padding: 9px 13px;
      border: 2px solid #1b1214;
      border-radius: 16px 16px 4px 16px;
      background: #fffaf4;
      color: #1b1214;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 4px 12px rgba(27,18,20,0.12);
      animation: pop 0.22s cubic-bezier(0.3,1.6,0.5,1);
      z-index: 100;
    }
    #bubble.show { display: block; }

    #bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid #1b1214;
    }
    #bubble::before {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #fffaf4;
      z-index: 1;
    }

    #bubble-text {
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 2px;
    }

    /* 快捷操作按钮组 */
    #bubble-actions {
      display: none;
      margin-top: 7px;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #bubble-actions.show {
      display: flex;
    }

    .bubble-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: #1b1214;
      background: #ffd34d;
      border: 1.5px solid #1b1214;
      border-radius: 999px;
      cursor: pointer;
      outline: none;
      transition: transform 0.12s, background 0.12s;
    }
    .bubble-btn:hover {
      transform: scale(1.08);
      background: #ffc425;
    }
    .bubble-btn:active {
      transform: scale(0.96);
    }
    .bubble-btn.btn-docker {
      background: #7cc8f2;
    }
    .bubble-btn.btn-docker:hover {
      background: #5db6e9;
    }
    .bubble-btn.btn-custom {
      background: #ffb8cf;
    }
    .bubble-btn.btn-custom:hover {
      background: #ff9cb9;
    }
    .bubble-btn.btn-campus {
      background: #a3e635;
    }
    .bubble-btn.btn-campus:hover {
      background: #84cc16;
    }

    /* 思考泡 */
    #think {
      display: none;
      position: absolute;
      top: -10px;
      left: 8px;
      gap: 4px;
      padding: 5px 8px;
      border: 2px solid #1b1214;
      border-radius: 999px;
      background: #fffaf4;
      flex-direction: row;
      z-index: 50;
    }
    #think.show { display: flex; }
    #think i {
      width: 5px; height: 5px;
      border: 1.5px solid #1b1214;
      border-radius: 50%;
      background: #ffd34d;
      animation: dot 1s ease-in-out infinite;
    }
    #think i:nth-child(2) { animation-delay: 0.15s; }
    #think i:nth-child(3) { animation-delay: 0.3s; }

    /* 感叹号 */
    #exclaim {
      display: none;
      position: absolute;
      top: -18px;
      left: 18px;
      color: #ff4d7d;
      font-size: 26px;
      font-weight: 900;
      -webkit-text-stroke: 1.5px #1b1214;
      animation: pop 0.25s cubic-bezier(0.3,1.8,0.5,1);
      z-index: 50;
    }
    #exclaim.show { display: block; }

    /* ZZZ */
    #zzz {
      display: none;
      position: absolute;
      top: -14px;
      right: 6px;
      pointer-events: none;
      z-index: 50;
    }
    #zzz.show { display: block; }
    #zzz span {
      position: absolute; right: 0; bottom: 0;
      color: #a8c8ff;
      font-weight: 800; font-size: 14px;
      -webkit-text-stroke: 1px #1b1214;
      opacity: 0;
      animation: zzz 3s ease-in-out infinite;
    }
    #zzz span:nth-child(2) { font-size: 18px; animation-delay: 1s; }
    #zzz span:nth-child(3) { font-size: 12px; animation-delay: 2s; }

    /* 轨道星星 */
    #orbit {
      display: none;
      position: absolute;
      top: -46px;
      left: 50%;
      width: 90px;
      height: 90px;
      margin-left: -45px;
      transform: scaleY(0.32);
      pointer-events: none;
      z-index: 50;
    }
    #orbit.show { display: block; }
    #ring {
      position: absolute; inset: 0;
      animation: spin 1.1s linear infinite;
    }
    #ring span {
      position: absolute;
      color: #ffd34d; font-size: 28px;
      -webkit-text-stroke: 1.5px #1b1214;
      line-height: 1;
    }
    #ring span:nth-child(1) { top: -12px; left: 30px; }
    #ring span:nth-child(2) { bottom: 0; left: -6px; }
    #ring span:nth-child(3) { bottom: 0; right: -6px; }

    /* 粒子 */
    .particle {
      position: absolute;
      top: 40%; left: 50%;
      pointer-events: none;
      opacity: 0;
      animation: burst 1.1s cubic-bezier(0.2,0.8,0.3,1) forwards;
      z-index: 40;
    }
    .heart { color: #ff5c8a; font-size: 18px; -webkit-text-stroke: 1px #1b1214; }

    @keyframes float {
      0%,100% { translate: 0 0; }
      50%     { translate: 0 -4px; }
    }
    @keyframes breathe {
      0%,100% { scale: 1 1; }
      50%     { scale: 1.015 0.985; }
    }
    @keyframes hopA {
      40% { translate: 0 -16px; scale: 0.96 1.06; }
      80% { translate: 0 0;     scale: 1.06 0.94; }
    }
    @keyframes hopB {
      40% { translate: 0 -16px; scale: 0.96 1.06; }
      80% { translate: 0 0;     scale: 1.06 0.94; }
    }
    @keyframes landA {
      30% { scale: 1.1 0.86; }
      65% { scale: 0.96 1.05; }
    }
    @keyframes landB {
      30% { scale: 1.1 0.86; }
      65% { scale: 0.96 1.05; }
    }
    @keyframes spin      { to { rotate: 360deg; } }
    @keyframes blushAnim { from { opacity: 0.25; } to { opacity: 0.6; } }
    @keyframes noseBubble {
      0%,100% { scale: 0.35; }
      55%     { scale: 1.05; }
      60%     { scale: 1; }
    }
    @keyframes pop  { from { scale: 0.4; opacity: 0; } }
    @keyframes dot {
      0%,100% { translate: 0 0;    opacity: 0.4; }
      50%     { translate: 0 -4px; opacity: 1; }
    }
    @keyframes zzz {
      0%   { opacity: 0; translate: 0 0; }
      20%  { opacity: 1; }
      100% { opacity: 0; translate: 18px -42px; rotate: 18deg; }
    }
    @keyframes burst {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.3); }
      70%  { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
                   rotate(var(--rot)) scale(1);
      }
    }
  </style>
</head>
<body>

<div id="pet-container">
  <!-- 原版气泡 -->
  <div id="bubble" class="interactive">
    <div id="bubble-text">想要打开 Cursor 吗？还是 Docker？</div>
    <div id="bubble-actions" class="bubble-actions">
      <button class="bubble-btn interactive" data-app="cursor">💻 Cursor</button>
      <button class="bubble-btn btn-docker interactive" data-app="docker">🐳 Docker</button>
      <button class="bubble-btn btn-custom interactive" data-app="custom" id="custom-app-btn">➕ 选软件</button>
      <button class="bubble-btn btn-campus interactive" data-app="schedule" id="campus-app-btn">📚 课表</button>
    </div>
  </div>

  <!-- 桌宠主体 -->
  <div id="pet" class="interactive" tabindex="0" role="button"
       aria-label="校园桌宠：单击戳一戳，拖动换位置，双击打开软件/课表，右键菜单"
       title="单击戳一戳 / 拖动摆放 / 双击快捷操作 / 右键菜单">

    <div id="think" aria-hidden="true"><i></i><i></i><i></i></div>
    <span id="exclaim" aria-hidden="true">!</span>
    <div id="zzz" aria-hidden="true">
      <span>z</span><span>Z</span><span>z</span>
    </div>

    <div id="orbit" aria-hidden="true">
      <div id="ring"><span>★</span><span>★</span><span>★</span></div>
    </div>

    <div id="pet-body">
      <div id="pet-motion">
        <svg id="pet-svg" viewBox="0 0 646 634" aria-hidden="true">
          <defs>
            <clipPath id="eye0-clip">
              <ellipse cx="247" cy="257" rx="60" ry="54"/>
            </clipPath>
            <clipPath id="eye1-clip">
              <ellipse cx="398" cy="248" rx="65" ry="55"/>
            </clipPath>
          </defs>

          <image href="./girl.webp" width="646" height="634"/>

          <g id="blush" class="blush" style="display:none">
            <ellipse cx="230" cy="324" rx="40" ry="17" fill="#ff6f91"/>
            <ellipse cx="425" cy="324" rx="40" ry="17" fill="#ff6f91"/>
          </g>

          <!-- 左眼 -->
          <g clip-path="url(#eye0-clip)">
            <g id="eye0-gaze" style="transform:translate(0px,0px)">
              <g class="pupil">
                <ellipse cx="247" cy="257" rx="11" ry="14" fill="#1b1214"/>
                <circle  cx="251" cy="252" r="3.6"         fill="#fff"/>
              </g>
            </g>
            <rect id="lid0" class="lid"
              x="183" y="199" width="128" height="116" fill="#f9d6de"/>
          </g>
          <path id="eye0-line" style="display:none"
            fill="none" stroke="#1b1214" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>

          <!-- 右眼 -->
          <g clip-path="url(#eye1-clip)">
            <g id="eye1-gaze" style="transform:translate(0px,0px)">
              <g class="pupil">
                <ellipse cx="398" cy="248" rx="11" ry="14" fill="#1b1214"/>
                <circle  cx="402" cy="243" r="3.6"         fill="#fff"/>
              </g>
            </g>
            <rect id="lid1" class="lid"
              x="329" y="189" width="138" height="118" fill="#f9d6de"/>
          </g>
          <path id="eye1-line" style="display:none"
            fill="none" stroke="#1b1214" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>

          <g id="mouth-wrap" style="display:none">
            <ellipse cx="336" cy="339" rx="45" ry="42" fill="#fde3e9"/>
            <path id="mouth-shape" fill="none"/>
          </g>

          <g id="nose-bubble" class="nose-bubble" style="display:none">
            <circle cx="326" cy="268" r="20"
              fill="rgba(170,215,255,0.45)" stroke="#6fb0e6" stroke-width="3"/>
            <circle cx="319" cy="261" r="5" fill="rgba(255,255,255,0.85)"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<script src="./pet.js"></script>
</body>
</html>
