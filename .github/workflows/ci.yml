name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支的新提交取消上一次还在跑的流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 这几个测试刻意不依赖 chromadb / langgraph，秒级就能跑完，
      # 需要完整依赖的那部分放在下面的 backend-full 作业。
      - name: 安装测试依赖
        run: pip install "fastapi>=0.115.0" "pyjwt>=2.8.0,<3" "python-dotenv>=1.0.0" "psycopg[binary]>=3.2.0" redis httpx pytest

      - name: 语法检查（含未在测试内导入的模块）
        run: python -m compileall -q backend

      - name: 单元测试
        working-directory: backend
        run: pytest test_auth.py test_chat_stream.py test_tenancy.py test_rate_limit.py -q

  backend-full:
    name: 后端（完整依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # test_abc_regressions.py 全程用 mock，不连 Redis 也不打大模型，
      # 但它 import 了 vector_service / graph_app，所以要装齐依赖。
      - name: 按锁文件安装
        run: |
          uv venv
          # PyTorch 索引也托管 certifi 等通用包但版本滞后；默认策略会只认它，要按版本跨索引挑
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r requirements.lock pytest

      - name: 检索与向量库回归测试
        working-directory: backend
        run: >-
          ../.venv/bin/pytest test_abc_regressions.py test_knowledge_scope.py
          test_memory_store.py test_workspace.py test_web_import.py test_api_features.py -q

  lock:
    name: 依赖锁文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      # 防止只改了 requirements.txt 却忘了重新生成锁文件，
      # 那样容器里装的还是旧版本，而本地看不出来。
      # 原地重跑生成命令：uv 会沿用锁里已有的版本，只有约束真的变了才会改动，
      # 因此上游发新版不会把这个作业刷红。输出到别处会让文件头的命令行注释不一致。
      - name: 校验锁文件与 requirements.txt 同步
        run: |
          uv pip compile requirements.txt \
            --python-platform linux --python-version 3.12 \
            --torch-backend cpu --output-file requirements.lock --quiet
          git diff --exit-code -- requirements.lock \
            || { echo "::error::requirements.lock 与 requirements.txt 不同步，请重新生成后提交"; exit 1; }

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 用 ci 而非 install：严格按 lock 安装，能抓出「装了包但没写进 package.json」
      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      # Prisma 客户端是生成产物不入库；generate 不连库，占位地址即可
      - name: 生成 Prisma 客户端
        working-directory: frontend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 构建
        working-directory: frontend
        run: npm run build

  compose:
    name: compose 配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 docker-compose.yml
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          AUTH_JWT_SECRET: ci-placeholder
